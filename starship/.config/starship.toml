# ~/.config/starship.toml — Clean, Fast Starship Configuration (Hack Nerd Font)

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = true
ssh_symbol = "󰒍 "
style = "bold yellow"
format = "[$ssh_symbol$hostname]($style) in "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
style = "bold cyan"

[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[python]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold yellow"

[nodejs]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold green"

[rust]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold red"

[golang]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold cyan"

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "bold blue"
